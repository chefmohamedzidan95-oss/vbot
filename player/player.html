<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlixMix Player | مشغل أفلام ومسلسلات</title>
    <!-- HLS.js for .m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: linear-gradient(180deg, rgba(11, 15, 25, 0.95) 0%, rgba(11, 15, 25, 0.7) 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff3d00, #ff9100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 10px rgba(255, 61, 0, 0.5);
        }
        .logo-text {
            display: flex;
            flex-direction: column;
        }
        .logo-title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff3d00, #ffab00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .logo-sub {
            font-size: 10px;
            color: #a0aab8;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 5;
            transition: opacity 0.3s;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff3d00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            color: #ff5252;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
            display: none;
        }
        footer {
            padding: 10px 16px;
            background: #0b0f19;
            text-align: center;
            font-size: 12px;
            color: #788291;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">🍿</div>
            <div class="logo-text">
                <span class="logo-title">FLIXMIX</span>
                <span class="logo-sub">أفلام ومسلسلات • MOVIES & SERIES</span>
            </div>
        </div>
    </header>

    <div class="video-container">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p id="statusText">جاري تحميل البث المباشر...</p>
            <p class="error-msg" id="errorText"></p>
        </div>
        <video id="video" controls autoplay playsinline poster=""></video>
    </div>

    <footer>
        مشغل FlixMix الرسمي • دعم كافة صيغ البث المباشر (HLS / M3U8 / MP4)
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('stream') || urlParams.get('url');
        const posterUrl = urlParams.get('poster') || urlParams.get('thumb') || '';
        const titleParam = urlParams.get('title') || '';

        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');
        const errorText = document.getElementById('errorText');

        if (posterUrl) {
            video.poster = posterUrl;
        }

        if (!streamUrl) {
            statusText.style.display = 'none';
            errorText.style.display = 'block';
            errorText.innerText = '❌ لم يتم التوفير رابط بث مباشر صحيح في الرابط.';
        } else {
            initPlayer(streamUrl);
        }

        function initPlayer(src) {
            if (Hls.isSupported() && (src.includes('.m3u8') || src.includes('urlset'))) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(src);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                    video.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                fallbackNative(src);
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || src.includes('.mp4')) {
                // Native playback (Safari, iOS, MP4)
                video.src = src;
                video.addEventListener('loadedmetadata', function() {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                    video.play().catch(() => {});
                });
                video.addEventListener('error', function() {
                    statusText.style.display = 'none';
                    errorText.style.display = 'block';
                    errorText.innerText = '❌ متعذر تشغيل البث المباشر. قد يكون الرابط منتهي الصلاحية.';
                });
            } else {
                fallbackNative(src);
            }
        }

        function fallbackNative(src) {
            video.src = src;
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
        }

        video.addEventListener('playing', () => {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
        });
    </script>
</body>
</html>
